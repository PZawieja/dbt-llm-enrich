<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="dbt-llm-enrich: LLM classification as a tested dbt layer">
<defs><style>
.sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style></defs>
<rect width="1280" height="640" fill="#0d0d0f"/>
<text x="80" y="120" class="mono" font-size="20" fill="#c8a96e" letter-spacing="4">PZAWIEJA / DBT-LLM-ENRICH</text>
<text x="80" y="210" class="sans" font-size="60" font-weight="700" fill="#f0ece4">LLM classification</text>
<text x="80" y="285" class="sans" font-size="60" font-weight="700" fill="#f0ece4">as a tested dbt layer.</text>
<text x="80" y="345" class="sans" font-size="26" fill="#9a958a">Cached by text and prompt. Scored against golden labels. Cost in a table.</text>
<g transform="translate(80 410)">
  <rect width="1120" height="150" rx="18" fill="#151517" stroke="#2a2924" stroke-width="2"/>
  <g class="sans">
    <text x="40" y="70" class="mono" font-size="44" fill="#f0ece4">99.3%</text>
    <text x="40" y="112" font-size="20" fill="#9a958a">category accuracy, prompt v2</text>
    <text x="420" y="70" class="mono" font-size="44" fill="#f0ece4">551 / 571</text>
    <text x="420" y="112" font-size="20" fill="#9a958a">from cache when 20 tickets changed</text>
    <text x="820" y="70" class="mono" font-size="44" fill="#f0ece4">$0.0651</text>
    <text x="820" y="112" font-size="20" fill="#9a958a">three batch runs, in total</text>
  </g>
</g>
</svg>
