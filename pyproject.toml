[project]
name = "dbt-llm-enrich"
version = "0.1.0"
description = "LLM ticket classification as a tested dbt layer: content-hash cache, Batches API, golden-set accuracy test and a cost table."
readme = "README.md"
license = "MIT"
authors = [{ name = "Piotr Zawieja" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14",
    "dbt-duckdb>=1.9",
    "duckdb>=1.1",
    "pyyaml>=6",
]

[project.scripts]
enrich = "dbt_llm_enrich.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "sqlfluff>=4.5.0",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["warehouse/dbt/dbt_packages", "warehouse/dbt/target"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
