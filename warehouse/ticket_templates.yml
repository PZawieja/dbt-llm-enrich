# Ticket templates for the Ledgerkite generator. Category boundaries follow the
# rules in prompts/classify_ticket.yml v2: leaving is cancellation even when money
# is mentioned, plan changes are billing, getting into the account is access even
# when it looks broken, a request for data is data_export but a broken export is a bug.
en:
  billing:
  - subject: Charged twice this month
    body: We were charged twice for the {plan} plan on {date}. Can you refund the duplicate charge of ${amount}?
    urgency: high
    sentiment: negative
  - subject: Invoice shows wrong VAT number
    body: Our invoice from Ledgerkite has the wrong VAT number on it. Our accountant needs a corrected copy before the quarter closes.
    urgency: normal
    sentiment: neutral
  - subject: Downgrade our plan
    body: We're a smaller team now. Please move us to a smaller plan from the next billing cycle. We still want to keep using Ledgerkite.
    urgency: normal
    sentiment: neutral
  - subject: Add 5 seats
    body: Can you add five more seats to our account? We're onboarding new staff on Monday.
    urgency: normal
    sentiment: positive
  - subject: Card declined but payment went through
    body: The billing page says my card was declined, but my bank shows the ${amount} payment as completed. Which one is right?
    urgency: normal
    sentiment: neutral
  - subject: Annual vs monthly pricing
    body: If we switch from monthly to annual billing, do we get the discount applied right away or at renewal?
    urgency: low
    sentiment: neutral
  - subject: Price went up without notice
    body: Our subscription price went up this month and I can't find any email about a price change. Please explain.
    urgency: normal
    sentiment: negative
  - subject: Need receipts for last year
    body: Where can I download receipts for all our Ledgerkite payments in 2025? Our auditors are asking.
    urgency: low
    sentiment: neutral
  bug:
  - subject: PDF invoices are blank
    body: Since this morning every invoice PDF we download is a blank page. The invoice looks fine in the app. Clients like {client} are waiting on their invoices.
    urgency: high
    sentiment: negative
  - subject: Reminders sent twice
    body: 'Payment reminders went out twice to the same client yesterday. {client} called us confused. Please fix this before tomorrow''s run.'
    urgency: high
    sentiment: negative
  - subject: Totals wrong with discounts
    body: When I add a 10% discount to an invoice with two tax rates, the total is off by a few cents. Invoice {invoice} is an example.
    urgency: normal
    sentiment: neutral
  - subject: Export to CSV fails
    body: Exporting the invoice list to CSV throws 'Something went wrong' after a few seconds. This worked last week.
    urgency: normal
    sentiment: negative
  - subject: Mobile app crashes on photo upload
    body: The mobile app closes as soon as I try to attach a receipt photo to an expense. iPhone, latest version of the app.
    urgency: normal
    sentiment: negative
  - subject: Accounting sync stuck
    body: The accounting sync has been stuck on 'syncing' for two days and new payments aren't showing up in our books.
    urgency: high
    sentiment: negative
  - subject: Dates show in US format
    body: Our account is set to UK date format, but due dates on {invoice} show as month/day, which is confusing our clients.
    urgency: normal
    sentiment: negative
  - subject: Search doesn't find old clients
    body: Searching for a client by name returns nothing for anyone added before March, but they're all still in the client list.
    urgency: normal
    sentiment: neutral
  access:
  - subject: Can't log in after password reset
    body: I reset my password and the new one doesn't work. I've tried three times and now I'm locked out.
    urgency: high
    sentiment: negative
  - subject: 2FA codes not accepted
    body: My authenticator codes are rejected every time. I got a new phone last week. How do I get back in?
    urgency: high
    sentiment: negative
  - subject: Invite email never arrives
    body: I invited our new bookkeeper to the account twice, but the invite email never shows up. Not in spam either.
    urgency: normal
    sentiment: neutral
  - subject: Give a colleague admin rights
    body: How do I give a colleague admin rights? She needs to change our billing details while I'm away.
    urgency: normal
    sentiment: neutral
  - subject: SSO login loops
    body: Signing in with Google takes me back to the login page in a loop. Email and password login works.
    urgency: normal
    sentiment: negative
  - subject: Remove a former employee
    body: A former employee still has access to our account. Please remove her today, she shouldn't see client data anymore.
    urgency: high
    sentiment: negative
  - subject: Account owner left the company
    body: Our account owner left the company and nobody else can change settings. How do we transfer ownership?
    urgency: normal
    sentiment: neutral
  feature_request:
  - subject: 'Request: partial payments'
    body: It would really help if clients could pay an invoice in two or three parts. We'd use it every week.
    urgency: low
    sentiment: positive
  - subject: Please add Polish invoice template
    body: We invoice clients in Poland and need a Polish-language invoice template. Is that on the roadmap?
    urgency: low
    sentiment: neutral
  - subject: Bulk edit due dates
    body: Could you add a way to change the due date on many invoices at once? Doing it one by one takes ages.
    urgency: low
    sentiment: neutral
  - subject: Dark mode
    body: Love the product. Any plans for dark mode in the web app?
    urgency: low
    sentiment: positive
  - subject: Webhook when an invoice is paid
    body: We'd like a webhook that fires when an invoice is paid so we can update our own systems.
    urgency: low
    sentiment: neutral
  - subject: Custom fields on clients
    body: We need custom fields on client records, like a purchase order number. Right now we put it in the notes.
    urgency: low
    sentiment: neutral
  how_to:
  - subject: How do I set up recurring invoices?
    body: How do I make an invoice repeat every month for {client}? I couldn't find it in the menu.
    urgency: low
    sentiment: neutral
  - subject: Change invoice numbering
    body: Can I change our invoice numbers to start with the year, like 2026-001? Where is that setting?
    urgency: low
    sentiment: neutral
  - subject: Add our logo
    body: How do I add our logo to invoices and quotes?
    urgency: low
    sentiment: neutral
  - subject: Send a quote first
    body: Is it possible to send a quote and turn it into an invoice once the client accepts? How?
    urgency: low
    sentiment: positive
  - subject: Where are late fees?
    body: Where do I turn on late fees for overdue invoices? A colleague said it's possible.
    urgency: low
    sentiment: neutral
  - subject: Connect our bank
    body: What's the best way to match bank payments to invoices in Ledgerkite?
    urgency: low
    sentiment: neutral
  - subject: Invoice in euros
    body: We usually invoice in dollars. How do I send one invoice in euros to a client in Germany?
    urgency: low
    sentiment: neutral
  cancellation:
  - subject: Cancel our subscription
    body: Please cancel our subscription at the end of this billing period. We've moved to a different tool.
    urgency: normal
    sentiment: neutral
  - subject: Not renewing
    body: Our annual plan renews on {date}. We won't be renewing, please make sure we aren't charged ${amount} again.
    urgency: normal
    sentiment: negative
  - subject: Close account and refund
    body: We'd like to close our account. We were charged ${amount} yesterday for a month we won't use. Can that be refunded?
    urgency: normal
    sentiment: negative
  - subject: Shutting down the business
    body: We're closing the business at the end of the month, so we need to cancel Ledgerkite. Thanks for everything.
    urgency: normal
    sentiment: positive
  - subject: Too expensive, cancelling
    body: After the price change the {plan} plan is too expensive for us. Please cancel our account.
    urgency: normal
    sentiment: negative
  - subject: Stop auto-renewal
    body: Please turn off auto-renewal. We're switching to our bank's invoicing at the end of the term.
    urgency: normal
    sentiment: neutral
  data_export:
  - subject: Export all invoices
    body: We need a full export of all our invoices and clients since 2023 for our new accountant. What's the best way?
    urgency: normal
    sentiment: neutral
  - subject: GDPR data request
    body: Under GDPR I'm requesting a copy of all personal data Ledgerkite holds about me.
    urgency: normal
    sentiment: neutral
  - subject: API access to payments
    body: Is there an API endpoint we can use to pull all payments into our data warehouse every night?
    urgency: low
    sentiment: neutral
  - subject: Migrating to another system
    body: We're migrating our invoices to an ERP system. Can you send us everything in one file, including line items?
    urgency: normal
    sentiment: neutral
  - subject: Download client list
    body: How can I get our full client list with addresses as a spreadsheet?
    urgency: low
    sentiment: neutral
  other:
  - subject: Partnership idea
    body: We run a bookkeeping firm with 40 clients on Ledgerkite. Do you have a partner program?
    urgency: low
    sentiment: positive
  - subject: Thank you
    body: Just wanted to say your support team sorted out our issue last week really quickly. Thanks!
    urgency: low
    sentiment: positive
  - subject: Speaking at your event?
    body: Are you looking for speakers for your customer meetup in the autumn? I'd love to share how we use the client portal.
    urgency: low
    sentiment: positive
  - subject: Your status page
    body: Is there a status page or email list for outages? Asking for our IT team.
    urgency: low
    sentiment: neutral
  - subject: Office address for a letter
    body: What's your postal address? Our legal team needs to send a signed document.
    urgency: low
    sentiment: neutral
native:
  de:
    billing:
    - subject: Doppelte Abbuchung
      body: Uns wurde der {plan}-Tarif am {date} zweimal abgebucht. Bitte erstatten Sie die doppelte Zahlung von {amount} €.
      urgency: high
      sentiment: negative
    bug:
    - subject: PDF-Rechnungen leer
      body: Seit heute Morgen sind alle heruntergeladenen Rechnungs-PDFs leer. In der App sieht die Rechnung normal aus.
      urgency: high
      sentiment: negative
    - subject: Zahlungserinnerungen doppelt
      body: Die Zahlungserinnerungen wurden gestern zweimal an denselben Kunden geschickt. Bitte beheben Sie das.
      urgency: high
      sentiment: negative
    access:
    - subject: Anmeldung nicht möglich
      body: Nach dem Zurücksetzen meines Passworts funktioniert das neue nicht. Ich bin jetzt gesperrt.
      urgency: high
      sentiment: negative
    how_to:
    - subject: Wiederkehrende Rechnungen
      body: Wie richte ich eine monatlich wiederkehrende Rechnung für einen Kunden ein?
      urgency: low
      sentiment: neutral
    cancellation:
    - subject: Kündigung
      body: Bitte kündigen Sie unser Abonnement zum Ende des Abrechnungszeitraums. Wir wechseln zu einem anderen Anbieter.
      urgency: normal
      sentiment: neutral
  fr:
    billing:
    - subject: Facture avec mauvais numéro de TVA
      body: Notre facture Ledgerkite indique un mauvais numéro de TVA. Notre comptable a besoin d'une version corrigée.
      urgency: normal
      sentiment: neutral
    bug:
    - subject: Export CSV en erreur
      body: L'export de la liste des factures en CSV affiche « Une erreur est survenue ». Cela fonctionnait la semaine dernière.
      urgency: normal
      sentiment: negative
    access:
    - subject: Codes 2FA refusés
      body: Mes codes d'authentification sont refusés depuis que j'ai changé de téléphone. Comment récupérer l'accès ?
      urgency: high
      sentiment: negative
    how_to:
    - subject: Ajouter notre logo
      body: Comment ajouter notre logo sur les factures et les devis ?
      urgency: low
      sentiment: neutral
    cancellation:
    - subject: Résiliation
      body: Nous fermons notre activité à la fin du mois. Merci de résilier notre abonnement Ledgerkite.
      urgency: normal
      sentiment: neutral
  es:
    billing:
    - subject: Subida de precio
      body: Nuestra suscripción ha subido este mes y no hemos recibido ningún aviso. ¿Pueden explicarlo?
      urgency: normal
      sentiment: negative
    bug:
    - subject: La app se cierra
      body: La aplicación móvil se cierra cuando intento adjuntar la foto de un recibo a un gasto.
      urgency: normal
      sentiment: negative
    access:
    - subject: Invitación no llega
      body: He invitado dos veces a nuestra nueva contable, pero el correo de invitación nunca llega.
      urgency: normal
      sentiment: neutral
    how_to:
    - subject: Facturar en euros
      body: Normalmente facturamos en dólares. ¿Cómo envío una factura en euros a un cliente?
      urgency: low
      sentiment: neutral
    cancellation:
    - subject: No vamos a renovar
      body: Nuestro plan anual se renueva el {date}. No vamos a renovar, por favor no nos cobren otra vez.
      urgency: normal
      sentiment: negative
  pl:
    billing:
    - subject: Dodatkowe stanowiska
      body: Proszę dodać pięć stanowisk do naszego konta. W poniedziałek zaczynają nowi pracownicy.
      urgency: normal
      sentiment: positive
    bug:
    - subject: Synchronizacja stoi
      body: Synchronizacja z księgowością od dwóch dni pokazuje „synchronizowanie” i nowe płatności się nie pojawiają.
      urgency: high
      sentiment: negative
    access:
    - subject: Usunięcie byłego pracownika
      body: Były pracownik nadal ma dostęp do naszego konta. Proszę go dziś usunąć.
      urgency: high
      sentiment: negative
    how_to:
    - subject: Numeracja faktur
      body: Czy mogę zmienić numerację faktur tak, żeby zaczynała się od roku? Gdzie jest to ustawienie?
      urgency: low
      sentiment: neutral
    cancellation:
    - subject: Rezygnacja z subskrypcji
      body: Po podwyżce plan jest dla nas za drogi. Proszę anulować naszą subskrypcję.
      urgency: normal
      sentiment: negative
