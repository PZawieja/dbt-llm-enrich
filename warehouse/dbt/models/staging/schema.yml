version: 2

models:
  - name: stg_accounts
    description: One row per customer account.
    columns:
      - name: account_id
        data_tests: [unique, not_null]

  - name: stg_tickets
    description: >-
      One row per ticket, with emails and phone numbers redacted. `ticket_text` is
      exactly what the classifier sees, and `content_hash` (SHA-256 of it) is the
      cache key, so an edited ticket gets a new hash and a duplicate shares one.
    columns:
      - name: ticket_id
        data_tests: [unique, not_null]
      - name: account_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id
      - name: ticket_text
        data_tests:
          - not_null
          - no_contact_details
      - name: content_hash
        data_tests: [not_null]

  - name: stg_llm_classifications
    description: >-
      The classification cache written by `enrich run`, one JSON line per
      (content_hash, prompt_hash, model). Never edited by hand.
    columns:
      - name: cache_key
        data_tests: [unique, not_null]
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: [billing, bug, access, feature_request, how_to, cancellation, data_export, other]
      - name: urgency
        data_tests:
          - accepted_values:
              arguments:
                values: [low, normal, high]
      - name: sentiment
        data_tests:
          - accepted_values:
              arguments:
                values: [negative, neutral, positive]

  - name: stg_enrichment_runs
    description: One line per `enrich run` that sent requests to the model.
    columns:
      - name: run_id
        data_tests: [unique, not_null]

  - name: stg_golden_ticket_labels
    description: Hand-reviewed labels for the accuracy test.
    columns:
      - name: ticket_id
        data_tests: [unique, not_null]
