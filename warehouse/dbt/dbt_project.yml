name: ledgerkite
version: "1.0.0"
profile: ledgerkite

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

vars:
  # Keep in sync with prompts/classify_ticket.yml `current` (a pytest checks it).
  prompt_version: v2
  model: claude-haiku-5-5
  classifications_path: ../../enrichment/classifications.jsonl
  runs_path: ../../enrichment/runs.jsonl

models:
  ledgerkite:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  ledgerkite:
    +schema: raw
    raw_tickets:
      +column_types:
        created_at: timestamp
        updated_at: timestamp
    raw_accounts:
      +column_types:
        signed_up_on: date
    golden_ticket_labels:
      +column_types:
        churn_signal: boolean
